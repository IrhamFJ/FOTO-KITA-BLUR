<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Camera Blur & Sound Gesture</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      background: #1e293b;
      aspect-ratio: 4 / 3;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.3s ease;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    video.blurred {
      filter: blur(20px);
    }

    .status-box {
      margin-top: 20px;
      padding: 12px 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      font-weight: 600;
      text-align: center;
      font-size: 15px;
    }

    .start-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .start-btn:hover {
      background-color: #1d4ed8;
    }
  </style>

  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <button id="startBtn" class="start-btn">Klik untuk Mulai Kamera & Audio</button>

  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="status-box" id="status">Klik tombol di atas untuk memulai</div>

  <script>
    const soundList = [
      "https://www.image2url.com/r2/default/audio/1784948365624-da933e71-5bb1-4c25-be18-85bfff671379.mp3",
      "https://www.image2url.com/r2/default/audio/1784948446680-5e93b61f-c085-4196-bf93-8aab9d11935d.mp3",
      "https://www.image2url.com/r2/default/audio/1784948477887-3a2a8ba6-3ec1-4dcf-9603-6c9268f4e1a6.mp3",
      "https://www.image2url.com/r2/default/audio/1784948508838-02d5248e-7830-4ebc-a16c-197a9a06ee2b.mp3"
    ];

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusElement = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    let isPeace = false;
    let stepCount = 0;
    
    // Gunakan AudioContext agar playback audio stabil di browser mobile/desktop
    let audioCtx = null;
    const audioBuffers = [null, null, null, null];

    async function loadAudios() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      // Preload audio buffer untuk menghindari delay saat deteksi
      for (let i = 0; i < soundList.length; i++) {
        try {
          const resp = await fetch(soundList[i]);
          const arrayBuffer = await resp.arrayBuffer();
          audioBuffers[i] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (err) {
          console.error("Gagal muat audio index " + i + ":", err);
        }
      }
    }

    function playSound(index) {
      if (!audioCtx || !audioBuffers[index]) return;
      
      try {
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[index];
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) {
        console.error("Audio play error:", e);
      }
    }

    // Hitung jarak 3D antar titik landmark
    function getDistance(p1, p2) {
      return Math.sqrt(
        Math.pow(p1.x - p2.x, 2) + 
        Math.pow(p1.y - p2.y, 2) + 
        Math.pow(p1.z - p2.z, 2)
      );
    }

    // Algoritma deteksi gesture Peace fleksibel & akurat
    function isPeaceGesture(lm) {
      const wrist = lm[0];

      // Jarak Ujung Jari ke Pergelangan
      const distIndexTip = getDistance(lm[8], wrist);
      const distMiddleTip = getDistance(lm[12], wrist);
      const distRingTip = getDistance(lm[16], wrist);
      const distPinkyTip = getDistance(lm[20], wrist);

      // Jarak Pangkal Jari (MCP) ke Pergelangan
      const distIndexMcp = getDistance(lm[5], wrist);
      const distMiddleMcp = getDistance(lm[9], wrist);
      const distRingMcp = getDistance(lm[13], wrist);
      const distPinkyMcp = getDistance(lm[17], wrist);

      // Telunjuk & Tengah Lurus (panjang jauh melampaui pangkal)
      const indexExtended = distIndexTip > distIndexMcp * 1.35;
      const middleExtended = distMiddleTip > distMiddleMcp * 1.35;

      // Manis & Kelingking Ditekuk (panjang tidak jauh dari pangkal)
      const ringFolded = distRingTip < distRingMcp * 1.25;
      const pinkyFolded = distPinkyTip < distPinkyMcp * 1.25;

      return indexExtended && middleExtended && ringFolded && pinkyFolded;
    }

    function onResults(results) {
      // Pastikan canvas pas dengan resolusi stream video aktual
      if (videoElement.videoWidth && videoElement.videoHeight) {
        if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
        }
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      let detectedPeace = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          // Render visualisasi skeleton tangan
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
          drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

          if (isPeaceGesture(landmarks)) {
            detectedPeace = true;
          }
        }
      }

      canvasCtx.restore();

      // State Machine Transisi Pose & Audio
      if (detectedPeace && !isPeace) {
        isPeace = true;
        videoElement.classList.add('blurred');

        if (stepCount === 0) {
          stepCount = 1;
          playSound(0);
          statusElement.innerText = "Status: PEACE 1 (Blur ON) - Sound 1";
        } else if (stepCount === 2) {
          stepCount = 3;
          playSound(2);
          statusElement.innerText = "Status: PEACE 2 (Blur ON) - Sound 3";
        }
      } 
      else if (!detectedPeace && isPeace) {
        isPeace = false;
        videoElement.classList.remove('blurred');

        if (stepCount === 1) {
          stepCount = 2;
          playSound(1);
          statusElement.innerText = "Status: LEPAS 1 (Blur OFF) - Sound 2";
        } else if (stepCount === 3) {
          stepCount = 4;
          playSound(3);
          statusElement.innerText = "Status: LEPAS 2 (Blur OFF) - Sound 4";
        }
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.innerText = "Memuat Audio & Kamera...";

      await loadAudios();

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      try {
        await camera.start();
        startBtn.style.display = 'none';
        statusElement.innerText = "Kamera Aktif: Tunjukkan Tangan Peace ✌️";
      } catch (err) {
        console.error("Gagal membuka kamera:", err);
        statusElement.innerText = "Error: Kamera tidak dapat diakses.";
        startBtn.disabled = false;
        startBtn.innerText = "Coba Lagi";
      }
    });
  </script>
</body>
</html>
